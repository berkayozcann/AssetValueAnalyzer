services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - asset-value-analyzer-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    image: asset-value-analyzer-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Istanbul
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__AssetValueAnalyzer: >-
        Server=mssql,1433;Database=AssetValueAnalyzer;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose};
        Encrypt=True;TrustServerCertificate=True
      Finmaks__ApiKey: "${FINMAKS_API_KEY:?Set FINMAKS_API_KEY before starting Compose}"
    ports:
      - "127.0.0.1:${WEB_PORT:-5271}:8080"
    volumes:
      - asset-value-analyzer-data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      mssql:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3m
    init: true
    restart: unless-stopped

  api:
    image: asset-value-analyzer-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Istanbul
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__AssetValueAnalyzer: >-
        Server=mssql,1433;Database=AssetValueAnalyzer;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose};
        Encrypt=True;TrustServerCertificate=True
    ports:
      - "127.0.0.1:${API_PORT:-5272}:8080"
    depends_on:
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    init: true
    restart: unless-stopped

volumes:
  asset-value-analyzer-mssql-data:
  asset-value-analyzer-data-protection:
